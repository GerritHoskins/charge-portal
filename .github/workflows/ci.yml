name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      # Lighthouse needs the production build that `check` just made, so skip the rebuild.
      - run: node scripts/lighthouse.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
      - run: npm run lighthouse:shop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-shop-reports
          path: .lighthouseci-shop
          if-no-files-found: ignore
